<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pärt clip · prototype</title>
<style>
:root{color-scheme:dark;--bg:#0d0e10;--fg:#c9ccd2;--dim:#7d828c;--line:#24272c;--acc:#aab4c4}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.stage{position:relative;width:min(100%,100vh);width:min(100%,100svh);aspect-ratio:1/1;margin:0 auto;background:#1a1b1e}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hud{position:absolute;left:10px;top:8px;font-size:12px;letter-spacing:.04em;color:#e8eaee;
  text-shadow:0 0 4px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;pointer-events:none}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
  text-align:center;color:#e8b4b4;background:#1a1b1e}
.panel{width:100%;max-width:560px;margin:0 auto;padding:0 16px 20px}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--dim)}
details[open] summary::after{content:"\2212"}
.row{display:flex;gap:8px;margin:0 0 12px}
button,.filebtn{flex:1;font:inherit;font-size:15px;color:var(--fg);background:#1b1d21;border:1px solid #30343a;
  border-radius:8px;padding:11px 8px;min-height:44px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none}
button:active,.filebtn:active{background:#262930}
.ctl{display:grid;grid-template-columns:92px 1fr 52px;align-items:center;gap:8px;margin:0 0 6px;min-height:34px}
.ctl label{color:var(--dim);font-size:13px}
.ctl output{text-align:right;font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;height:30px;accent-color:#9aa6b8;background:transparent}
input[type=file]{display:none}
.note{color:var(--dim);font-size:12px;margin:2px 0 12px}
footer{padding:14px 0 0;color:var(--dim);font-size:11.5px;letter-spacing:.03em;text-align:center}
@media (min-aspect-ratio:1/1){
  .app{flex-direction:row;align-items:flex-start;justify-content:center}
  .stage{width:min(100vh,calc(100vw - 340px));width:min(100svh,calc(100vw - 340px));margin:0}
  .panel{width:340px;max-height:100vh;max-height:100svh;overflow:auto;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hud" id="hud">0.0 s · 0 drops</div>
    <div class="err" id="err"></div>
  </div>
  <div class="panel">
    <details open>
      <summary>Controls</summary>
      <div class="row">
        <button id="bPlay" type="button">Pause</button>
        <button id="bRestart" type="button">Restart</button>
        <button id="bNext" type="button">Next event</button>
      </div>
      <div class="ctl"><label for="sReflect">Reflect</label><input id="sReflect" type="range" min="0" max="1" step="0.01" value="0.25"><output id="oReflect"></output></div>
      <div class="ctl"><label for="sRefract">Refract</label><input id="sRefract" type="range" min="0" max="3" step="0.05" value="0.8"><output id="oRefract"></output></div>
      <div class="ctl"><label for="sDamp">Damping</label><input id="sDamp" type="range" min="0" max="0.03" step="0.0005" value="0.008"><output id="oDamp"></output></div>
      <div class="ctl"><label for="sIdle">Idle ripple</label><input id="sIdle" type="range" min="0" max="0.02" step="0.0005" value="0.004"><output id="oIdle"></output></div>
      <div class="ctl"><label for="sSize">Drop size</label><input id="sSize" type="range" min="0.5" max="2" step="0.05" value="1"><output id="oSize"></output></div>
      <div class="ctl"><label for="sTime">Time scale</label><input id="sTime" type="range" min="0.25" max="4" step="0.05" value="1"><output id="oTime"></output></div>
      <div class="row" style="margin-top:8px">
        <label class="filebtn" for="fFiles">Upload 1–4 images</label>
        <input id="fFiles" type="file" accept="image/*" multiple>
        <button id="bProc" type="button">Procedural</button>
      </div>
      <p class="note" id="vinfo">Variants: 4 procedural placeholders.</p>
    </details>
    <footer>Pärt clip · prototype · 31 Oct 2026 · private study · no audio</footer>
  </div>
</div>

<script>
(() => {
'use strict';

/* ======================================================================
   Pärt clip prototype. Silent, no external code, no audio, no Pärt material.
   Design: docs/XANADU-SOUND-project.md section 10 (First design + Realisation notes).
   ====================================================================== */

const GRID     = 256;       // heightfield resolution (256 or 512)
const VAR_RES  = 512;       // each profile variant, square
const DT       = 1 / 60;    // fixed substep (s)
const ITER     = 2;         // wave iterations per substep
const C2       = 0.42;      // (c*dt/dx)^2 per iteration; must stay < 0.5 for stability
const MAXSTEPS = 32;        // catch-up cap per frame (sim slows instead of freezing)
const DURATION = 60;        // length of the synthetic event list (s)
const REVEAL   = 0.8;       // mask follow speed (variants per second): reveal lags the impact
const DROP_R0  = 0.10;      // drop radius in uv units at size 1.0 (scale slider multiplies)
const DROP_AMP = 0.8;       // impulse depth at size 1.0 (scale slider multiplies)
const SURFACE_TONE = [140, 144, 150];   // ground colour of variants; letterbox uses the same

const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.min(1, Math.max(0, x));

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ======================================================================
   EVENTS: the drop list.

   RULE (position follows pitch, not chance):
     - `pitch` in 0..1  ->  radius from the centre of the surface.
         low pitch = outer, high pitch = inner:
         r = rMin + (1 - pitch) * (rMax - rMin)     (uv units, surface is 1 x 1)
     - angle = angle0 + omega * t   (slow rotation; one turn per 45 s)
     - x = 0.5 + r cos(angle), y = 0.5 + r sin(angle)    (y down, image space)
     - `vel` in 0..1  ->  size = 0.5 + 0.5 * vel         (size 0.5 .. 1.0)

   To use a real recording: produce events.json as an array of
   { t, pitch, vel } (seconds, 0..1, 0..1) and call
       XANADU.setEvents(json)
   in the console (or replace synthEvents() below by fetch + dropFromEvent).
   Same field names, same rule; nothing else needs to change.
   ====================================================================== */
const RULE = { rMin: 0.04, rMax: 0.42, angle0: 0.6, omega: (2 * Math.PI) / 45 };

function dropFromEvent(e) {
  const pitch = clamp01(e.pitch);
  const vel = e.vel == null ? 0.7 : clamp01(e.vel);
  const r = RULE.rMin + (1 - pitch) * (RULE.rMax - RULE.rMin);
  const a = RULE.angle0 + RULE.omega * e.t;
  return { t: e.t, x: 0.5 + r * Math.cos(a), y: 0.5 + r * Math.sin(a),
           size: 0.5 + 0.5 * vel, pitch, vel };
}

// Synthetic, Fur Alina-like: ~40 events/min, gaps 0.6..3.0 s, ~10 % doubles within 0.3 s,
// pitch = slow melodic contour + small random walk (seeded, so reproducible).
function synthEvents() {
  const rnd = mulberry32(20261031);
  const raw = [];
  let t = 0.5, walk = 0;
  while (t < DURATION) {
    const base = 0.5 + 0.32 * Math.sin((2 * Math.PI * t) / 23 + 0.8) + 0.12 * Math.sin((2 * Math.PI * t) / 7.3);
    walk = walk * 0.7 + (rnd() - 0.5) * 0.35;
    const pitch = clamp01(base + walk);
    raw.push({ t, pitch, vel: Math.pow(rnd(), 0.9) });
    if (rnd() < 0.10) {
      const t2 = t + 0.12 + rnd() * 0.18;
      if (t2 < DURATION) raw.push({ t: t2, pitch: clamp01(pitch + (rnd() < 0.5 ? -1 : 1) * (0.08 + rnd() * 0.12)), vel: Math.pow(rnd(), 0.9) });
    }
    t += 0.6 + 2.4 * Math.pow(rnd(), 1.25);
  }
  return raw.map(dropFromEvent);
}
let EVENTS = synthEvents();

/* ======================================================================
   Procedural placeholder variants: an abstract, generic human-profile
   silhouette (bezier curves), softened, with small per-variant differences.
   ====================================================================== */
const FRONT = [   // forehead -> chin -> throat, facing right (unit square, y down)
  [0.560, 0.120], [0.618, 0.200], [0.632, 0.285], [0.622, 0.325], [0.650, 0.385],
  [0.692, 0.452], [0.650, 0.472], [0.660, 0.500], [0.640, 0.518], [0.652, 0.540],
  [0.634, 0.566], [0.650, 0.610], [0.620, 0.650], [0.560, 0.665], [0.545, 0.730],
  [0.560, 0.840], [0.640, 0.960]
];
const BACK = [    // nape -> back of skull -> crown
  [0.150, 1.020], [0.330, 0.800], [0.335, 0.680], [0.265, 0.500], [0.275, 0.280], [0.360, 0.140], [0.470, 0.100]
];
const VPARAMS = [
  { tone: 0.20, dx:  0.000, dy:  0.000, sc: 1.00, hair: 0.00, nose:  0.000, lip:  0.000, chin:  0.000, bgShift:  0 },
  { tone: 0.235, dx:  0.012, dy: -0.008, sc: 1.02, hair: 0.55, nose:  0.012, lip:  0.008, chin: -0.006, bgShift:  6 },
  { tone: 0.17, dx: -0.010, dy:  0.012, sc: 0.98, hair: 1.00, nose: -0.010, lip: -0.006, chin:  0.012, bgShift: -5 },
  { tone: 0.26, dx:  0.006, dy:  0.016, sc: 1.03, hair: 0.25, nose:  0.006, lip:  0.012, chin:  0.004, bgShift:  3 }
];

function curveThrough(ctx, pts, move) {   // Catmull-Rom -> cubic bezier
  if (move) ctx.moveTo(pts[0][0], pts[0][1]); else ctx.lineTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                      p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
}

function silhouettePath(ctx, P) {
  const front = FRONT.map((p, i) => {
    let [x, y] = p;
    if (i >= 4 && i <= 6) x += P.nose;                 // nose
    if (i >= 7 && i <= 10) x += P.lip;                 // lips
    if (i >= 11 && i <= 13) { x += P.chin; y += P.chin * 0.5; }  // chin
    return [x, y];
  });
  ctx.beginPath();
  curveThrough(ctx, front, true);
  ctx.lineTo(0.70, 1.02);
  curveThrough(ctx, BACK, false);
  ctx.closePath();
}

function makeProceduralVariant(v) {
  const P = VPARAMS[v % VPARAMS.length];
  const S = VAR_RES, H = 256;
  // 1) sharp silhouette on a small canvas (light halo first, dark body on top)
  const sil = document.createElement('canvas'); sil.width = sil.height = H;
  const sx = sil.getContext('2d');
  sx.setTransform(H * P.sc, 0, 0, H * P.sc, H * (P.dx + 0.5 * (1 - P.sc)), H * (P.dy + 0.5 * (1 - P.sc)));
  const hair = () => {
    sx.beginPath();
    sx.ellipse(0.40 - 0.045 * P.hair, 0.30, 0.19 + 0.05 * P.hair, 0.22 + 0.04 * P.hair, -0.15, 0, Math.PI * 2);
  };
  sx.lineJoin = 'round'; sx.lineWidth = 0.035; sx.strokeStyle = 'rgba(190,196,206,0.55)';
  silhouettePath(sx, P); sx.stroke(); hair(); sx.stroke();
  const g = Math.round(P.tone * 255);
  sx.fillStyle = `rgb(${g},${g + 2},${g + 6})`;
  silhouettePath(sx, P); sx.fill(); hair(); sx.fill();
  sx.setTransform(1, 0, 0, 1, 0, 0);
  sx.globalCompositeOperation = 'source-atop';           // soft vertical shading inside
  const lg = sx.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, 'rgba(255,255,255,0.22)'); lg.addColorStop(0.6, 'rgba(255,255,255,0)'); lg.addColorStop(1, 'rgba(0,0,0,0.25)');
  sx.fillStyle = lg; sx.fillRect(0, 0, H, H);
  // 2) blur by down- then up-scaling (no ctx.filter: not available everywhere)
  const mid = document.createElement('canvas'); mid.width = mid.height = 56;
  const mx = mid.getContext('2d'); mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high';
  mx.drawImage(sil, 0, 0, H, H, 0, 0, 56, 56);
  const mid2 = document.createElement('canvas'); mid2.width = mid2.height = 120;
  const m2 = mid2.getContext('2d'); m2.imageSmoothingEnabled = true; m2.imageSmoothingQuality = 'high';
  m2.drawImage(mid, 0, 0, 56, 56, 0, 0, 120, 120);
  // 3) ground + soft silhouette
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  const b = P.bgShift, T = SURFACE_TONE;
  const gr = x.createLinearGradient(0, 0, S * 0.3, S);
  gr.addColorStop(0, `rgb(${T[0] + 14 + b},${T[1] + 14 + b},${T[2] + 14 + b})`);
  gr.addColorStop(1, `rgb(${T[0] - 12 + b},${T[1] - 12 + b},${T[2] - 12 + b})`);
  x.fillStyle = gr; x.fillRect(0, 0, S, S);
  x.drawImage(mid2, 0, 0, 120, 120, 0, 0, S, S);
  return c;
}

function fitToSquare(img) {     // uploaded image: keep aspect, letterbox with surface tone
  const S = VAR_RES, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = `rgb(${SURFACE_TONE[0]},${SURFACE_TONE[1]},${SURFACE_TONE[2]})`;
  x.fillRect(0, 0, S, S);
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const k = Math.min(S / w, S / h), dw = w * k, dh = h * k;
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
  return c;
}

/* ======================================================================
   WebGL2 setup
   ====================================================================== */
const canvas = $('c');
function fail(msg) {
  const e = $('err'); e.textContent = msg; e.style.display = 'flex';
  console.error(msg);
}
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) { fail('WebGL2 is not available in this browser.'); return; }
const extF = gl.getExtension('EXT_color_buffer_float');
const extH = gl.getExtension('EXT_color_buffer_half_float');
if (!extF && !extH) { fail('Float render targets are not available (EXT_color_buffer_float).'); return; }

const VS = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// Wave step (Verlet): state.xy = (height, previous height). Drop impulse is added to both
// so it starts at rest; the sponge near the border absorbs reflections.
const FS_SIM = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uState;
uniform float uC2, uDamp, uSize;
uniform vec4 uDrop;            // xy = centre (uv, v up), z = radius (uv), w = amplitude (0 = none)
in vec2 vUv; out vec4 o;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  ivec2 mx = ivec2(int(uSize) - 1);
  vec2 s = texelFetch(uState, ip, 0).xy;
  float hl = texelFetch(uState, clamp(ip + ivec2(-1, 0), ivec2(0), mx), 0).x;
  float hr = texelFetch(uState, clamp(ip + ivec2( 1, 0), ivec2(0), mx), 0).x;
  float hd = texelFetch(uState, clamp(ip + ivec2( 0,-1), ivec2(0), mx), 0).x;
  float hu = texelFetch(uState, clamp(ip + ivec2( 0, 1), ivec2(0), mx), 0).x;
  float lap = hl + hr + hd + hu - 4.0 * s.x;
  vec2 uv = gl_FragCoord.xy / uSize;
  float edge = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  float damp = uDamp + (1.0 - smoothstep(0.0, 0.10, edge)) * 0.07;
  float hn = s.x + (s.x - s.y) * (1.0 - damp) + uC2 * lap;
  float a = 0.0;
  if (uDrop.w != 0.0) {
    float d = distance(uv, uDrop.xy) / uDrop.z;
    if (d < 1.0) a = uDrop.w * (0.5 + 0.5 * cos(3.14159265 * d));
  }
  o = vec4(hn + a, s.x + a, 0.0, 1.0);
}`;

// Variant mask. Each texel keeps TWO phases as (cos, sin) pairs: target (zw of previous pass
// kept in .xy) and shown (.zw). Phase p in [0,N): integer part = variant index.
// Encoding as an angle makes the texture safely bilinear-filterable across the wrap.
const FS_MASK = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uIn;
uniform vec4 uDrop;            // xy centre (uv), z radius, w active
uniform float uN, uStep, uSize;
out vec4 o;
void main(){
  vec4 m = texelFetch(uIn, ivec2(gl_FragCoord.xy), 0);
  float k = 6.28318531 / uN;
  float pt = mod(atan(m.y, m.x) / k + uN, uN);
  float ps = mod(atan(m.w, m.z) / k + uN, uN);
  if (uDrop.w > 0.5) {
    vec2 uv = gl_FragCoord.xy / uSize;
    float w = 1.0 - smoothstep(0.65 * uDrop.z, uDrop.z, distance(uv, uDrop.xy));   // feathered
    pt = mod(pt + w, uN);                                                           // advance to next variant
  }
  float fwd = mod(pt - ps + uN, uN);
  if (fwd > uN - 0.01) fwd = 0.0;
  float st = min(fwd, uStep);
  ps = (fwd - st < 0.003) ? pt : mod(ps + st, uN);
  o = vec4(cos(pt * k), sin(pt * k), cos(ps * k), sin(ps * k));
}`;

// Derived field for display: xy = slope per texel, z = height. Half-float, linearly filtered.
const FS_DERIVE = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uState; uniform float uSize;
in vec2 vUv; out vec4 o;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy); ivec2 mx = ivec2(int(uSize) - 1);
  float h  = texelFetch(uState, ip, 0).x;
  float hl = texelFetch(uState, clamp(ip + ivec2(-1, 0), ivec2(0), mx), 0).x;
  float hr = texelFetch(uState, clamp(ip + ivec2( 1, 0), ivec2(0), mx), 0).x;
  float hd = texelFetch(uState, clamp(ip + ivec2( 0,-1), ivec2(0), mx), 0).x;
  float hu = texelFetch(uState, clamp(ip + ivec2( 0, 1), ivec2(0), mx), 0).x;
  o = vec4((hr - hl) * 0.5, (hu - hd) * 0.5, h, 1.0);
}`;

const FS_DISPLAY = `#version 300 es
precision highp float; precision highp sampler2D; precision highp sampler2DArray;
uniform sampler2D uDerived, uMask;
uniform sampler2DArray uVar;
uniform float uReflect, uRefract, uIdle, uTime, uN;
uniform vec4 uW[4];            // idle waves: k.xy, omega, phase (seeded in JS)
in vec2 vUv; out vec4 outC;

float hash12(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}
float band(float x, float w){ return 1.0 - smoothstep(0.0, w, abs(x)); }

// Procedural studio environment: soft gradient sky + a few blurred highlight bands.
vec3 envMap(vec2 e){
  vec3 sky = mix(vec3(0.050, 0.058, 0.075), vec3(0.78, 0.81, 0.86), smoothstep(-0.9, 0.9, e.y * 0.9 + e.x * 0.25));
  float b1 = band(e.y * 0.97 + e.x * 0.25 - 0.25, 0.42);
  float b2 = band(e.x - 0.55 - 0.3 * e.y, 0.55) * 0.6;
  float b3 = band(e.y + 0.45, 0.30) * 0.5;
  return sky + (b1 * 0.50 + b2 * 0.55 + b3 * 0.4) * vec3(1.0, 0.99, 0.97);
}

void main(){
  vec2 uv = vUv;
  // 1. surface slope: simulated field + seeded idle ripple
  vec2 g = texture(uDerived, uv).xy;
  for (int i = 0; i < 4; i++) {
    vec2 k = uW[i].xy;
    g += normalize(k) * cos(dot(k, uv) + uW[i].z * uTime + uW[i].w) * uIdle * 0.5;
  }
  // 2. refraction: the profile texture is read at a slope-shifted position
  vec2 suv = clamp(uv + g * uRefract * 0.7, 0.003, 0.997);
  // 3. variant selection from the mask (shown phase), feathered blend of two layers
  vec4 M = texture(uMask, suv);
  float k = 6.28318531 / uN;
  float p = atan(M.w, M.z) / k; if (p < 0.0) p += uN;
  float fi = floor(p); float f = p - fi;
  if (fi > uN - 0.5) fi = 0.0;
  float fb = (fi + 1.0 > uN - 0.5) ? 0.0 : fi + 1.0;
  float m = smoothstep(0.3, 0.7, f);
  vec2 iuv = vec2(suv.x, 1.0 - suv.y);
  vec3 A = texture(uVar, vec3(iuv, fi)).rgb;
  vec3 B = texture(uVar, vec3(iuv, fb)).rgb;
  vec3 alb = mix(A, B, m);
  alb *= alb;                                     // to linear (approx.)
  alb *= vec3(0.93, 0.96, 1.0) * 0.9;             // seen through a thin film: slightly cooler, darker
  // 4. lighting of the image from the heightfield normals
  vec3 nL = normalize(vec3(-g * 6.0, 1.0));
  vec3 L = normalize(vec3(-0.5, 0.6, 0.65));
  float dif = 0.55 + 0.75 * max(dot(nL, L), 0.0);
  // 5. metal: Fresnel reflection of the environment, F0 = uReflect
  vec3 nE = normalize(vec3(-g * 16.0, 1.0));
  vec3 V = normalize(vec3(0.5 - uv, 1.7));
  vec3 R = reflect(-V, nE);
  float cv = max(dot(nE, V), 0.0);
  float F = uReflect + (1.0 - uReflect) * pow(1.0 - cv, 5.0);
  vec3 en = envMap(R.xy / max(R.z, 0.15) * 1.4);
  float brush = vnoise(vec2(uv.x * 5.0, uv.y * 300.0)) - 0.5;   // brushed streaks
  en *= 1.0 + brush * 0.07;
  vec3 H = normalize(L + V);
  float sp = pow(max(dot(nE, H), 0.0), 220.0);
  vec3 col = alb * dif * (1.0 - F) + en * F + vec3(sp) * (0.25 + 0.6 * uReflect);
  col = sqrt(max(col, 0.0));
  col += (hash12(gl_FragCoord.xy) - 0.5) / 255.0;                   // dither
  outC = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader compile: ' + gl.getShaderInfoLog(s));
  return s;
}
function makeProg(fs, names) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Program link: ' + gl.getProgramInfoLog(p));
  const u = {}; names.forEach((n) => { u[n] = gl.getUniformLocation(p, n); });
  return { p, u };
}

let progSim, progMask, progDerive, progDisplay;
try {
  progSim = makeProg(FS_SIM, ['uState', 'uC2', 'uDamp', 'uSize', 'uDrop']);
  progMask = makeProg(FS_MASK, ['uIn', 'uDrop', 'uN', 'uStep', 'uSize']);
  progDerive = makeProg(FS_DERIVE, ['uState', 'uSize']);
  progDisplay = makeProg(FS_DISPLAY, ['uDerived', 'uMask', 'uVar', 'uReflect', 'uRefract', 'uIdle', 'uTime', 'uN', 'uW']);
} catch (err) { fail(String(err.message || err)); return; }

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

function makeTarget(size, internal, type, filter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, size, size, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  return { tex, fbo, ok };
}
function makePair(internal, type, filter) {
  const a = makeTarget(GRID, internal, type, filter), b = makeTarget(GRID, internal, type, filter);
  return { t: [a, b], i: 0, ok: a.ok && b.ok, get cur() { return this.t[this.i]; }, get nxt() { return this.t[1 - this.i]; }, flip() { this.i = 1 - this.i; } };
}

let state = extF ? makePair(gl.RGBA32F, gl.FLOAT, gl.NEAREST) : null;
if (!state || !state.ok) state = makePair(gl.RGBA16F, gl.HALF_FLOAT, gl.NEAREST);
const mask = makePair(gl.RGBA16F, gl.HALF_FLOAT, gl.LINEAR);
const derived = makeTarget(GRID, gl.RGBA16F, gl.HALF_FLOAT, gl.LINEAR);
if (!state.ok || !mask.ok || !derived.ok) { fail('Float framebuffers are incomplete on this device.'); return; }

// Variant stack: TEXTURE_2D_ARRAY, 4 layers
const varTex = gl.createTexture();
let variantN = 4;
let proceduralMode = true;
function setVariants(canvases) {
  const N = canvases.length;
  const S = VAR_RES, layer = S * S * 4, data = new Uint8Array(layer * 4);
  for (let i = 0; i < 4; i++) {
    const c = canvases[i % N];
    data.set(c.getContext('2d').getImageData(0, 0, S, S).data, i * layer);
  }
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, varTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, S, S, 4, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  variantN = N;
}
function useProcedural() {
  setVariants([0, 1, 2, 3].map(makeProceduralVariant));
  proceduralMode = true;
  $('vinfo').textContent = 'Variants: 4 procedural placeholders.';
}

// Seeded idle ripple waves (k.xy in uv radians, omega, phase)
const idleW = (() => {
  const r = mulberry32(777), a = new Float32Array(16);
  for (let i = 0; i < 4; i++) {
    const ang = r() * Math.PI * 2, f = 2.0 + r() * 3.5;
    a[i * 4] = Math.cos(ang) * f * 2 * Math.PI; a[i * 4 + 1] = Math.sin(ang) * f * 2 * Math.PI;
    a[i * 4 + 2] = 0.35 + r() * 0.6; a[i * 4 + 3] = r() * 6.2832;
  }
  return a;
})();

/* ======================================================================
   Simulation (fixed 1/60 s substeps) and rendering
   ====================================================================== */
const params = { reflect: 0.25, refract: 0.8, damp: 0.008, idle: 0.004, size: 1, time: 1 };
let playing = true, stepCount = 0, acc = 0, evIdx = 0, evCount = 0;
let manualQ = [], manualN = 0;

function bindTex(unit, target, tex, loc) {
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(target, tex); gl.uniform1i(loc, unit);
}
function pass(prog, target, size) {
  gl.useProgram(prog.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, size, size);
  return prog;
}

function simPass(drop) {
  const P = pass(progSim, state.nxt, GRID);
  bindTex(0, gl.TEXTURE_2D, state.cur.tex, P.u.uState);
  gl.uniform1f(P.u.uC2, C2); gl.uniform1f(P.u.uDamp, params.damp); gl.uniform1f(P.u.uSize, GRID);
  gl.uniform4f(P.u.uDrop, drop ? drop[0] : 0, drop ? drop[1] : 0, drop ? drop[2] : 1, drop ? drop[3] : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  state.flip();
}
function maskPass(drop) {
  const P = pass(progMask, mask.nxt, GRID);
  bindTex(0, gl.TEXTURE_2D, mask.cur.tex, P.u.uIn);
  gl.uniform4f(P.u.uDrop, drop ? drop[0] : 0, drop ? drop[1] : 0, drop ? drop[2] : 1, drop ? 1 : 0);
  gl.uniform1f(P.u.uN, variantN); gl.uniform1f(P.u.uStep, REVEAL * DT); gl.uniform1f(P.u.uSize, GRID);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  mask.flip();
}

// event {x,y (image space, y down), size} -> [u, v (v up), radius, amplitude]
function dropUniforms(ev) {
  const s = ev.size * params.size;
  return [ev.x, 1 - ev.y, DROP_R0 * s, -DROP_AMP * s];
}

function substep() {
  const t = stepCount * DT;
  let ev = null;
  if (manualQ.length) { ev = manualQ.shift(); evCount++; }
  else if (evIdx < EVENTS.length && EVENTS[evIdx].t <= t + 1e-9) { ev = EVENTS[evIdx++]; evCount++; }
  const d = ev ? dropUniforms(ev) : null;
  simPass(d);
  for (let i = 1; i < ITER; i++) simPass(null);
  maskPass(d);
  stepCount++;
}

function clearTarget(tg, r, g, b, a) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, tg.fbo); gl.viewport(0, 0, GRID, GRID);
  gl.clearColor(r, g, b, a); gl.clear(gl.COLOR_BUFFER_BIT);
}
function restart() {
  state.t.forEach((t) => clearTarget(t, 0, 0, 0, 1));
  mask.t.forEach((t) => clearTarget(t, 1, 0, 1, 0));
  clearTarget(derived, 0, 0, 0, 1);
  stepCount = 0; acc = 0; evIdx = 0; evCount = 0; manualQ = []; manualN = 0;
}

// Manual drop: same position rule, driven by a counter so it is reproducible too.
function nextEvent() {
  const i = manualN++;
  const pitch = 0.5 + 0.42 * Math.sin(i * 1.7 + 0.3);
  const e = dropFromEvent({ t: stepCount * DT + i * 0.37, pitch, vel: 0.55 + 0.45 * Math.sin(i * 2.3 + 1.0) * 0.5 + 0.2 });
  manualQ.push(e);
  if (!playing) substep();     // paused: advance exactly one substep so the drop lands
}

function render() {
  // size the backing store
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.min(1024, Math.round(r.width * dpr)));
  if (canvas.width !== w || canvas.height !== w) { canvas.width = w; canvas.height = w; }

  const D = pass(progDerive, derived, GRID);
  bindTex(0, gl.TEXTURE_2D, state.cur.tex, D.u.uState);
  gl.uniform1f(D.u.uSize, GRID);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const P = pass(progDisplay, null, w);
  bindTex(0, gl.TEXTURE_2D, derived.tex, P.u.uDerived);
  bindTex(1, gl.TEXTURE_2D, mask.cur.tex, P.u.uMask);
  bindTex(2, gl.TEXTURE_2D_ARRAY, varTex, P.u.uVar);
  gl.uniform1f(P.u.uReflect, params.reflect); gl.uniform1f(P.u.uRefract, params.refract);
  gl.uniform1f(P.u.uIdle, params.idle); gl.uniform1f(P.u.uTime, stepCount * DT + (playing ? acc : 0));
  gl.uniform1f(P.u.uN, variantN); gl.uniform4fv(P.u.uW, idleW);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let last = 0, hudKey = '';
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 0.1); last = now;
  if (playing) {
    acc += dt * params.time;
    let n = 0;
    while (acc >= DT && n < MAXSTEPS) { substep(); acc -= DT; n++; }
    if (acc >= DT) acc = 0;     // backlog: slow down rather than spiral
  }
  render();
  const key = Math.floor(stepCount / 6) + ':' + evCount;
  if (key !== hudKey) {
    hudKey = key;
    $('hud').textContent = (stepCount * DT).toFixed(1) + ' s · ' + evCount + ' drops' + (manualN ? ' (' + manualN + ' manual)' : '');
  }
  requestAnimationFrame(frame);
}

/* ======================================================================
   UI
   ====================================================================== */
const fmt = { reflect: (v) => v.toFixed(2), refract: (v) => v.toFixed(2), damp: (v) => v.toFixed(4),
              idle: (v) => v.toFixed(4), size: (v) => v.toFixed(2) + 'x', time: (v) => v.toFixed(2) + 'x' };
const ids = { reflect: 'Reflect', refract: 'Refract', damp: 'Damp', idle: 'Idle', size: 'Size', time: 'Time' };
Object.keys(ids).forEach((k) => {
  const s = $('s' + ids[k]), o = $('o' + ids[k]);
  const upd = () => { params[k] = parseFloat(s.value); o.textContent = fmt[k](params[k]); };
  s.addEventListener('input', upd); upd();
});
$('bPlay').addEventListener('click', () => { playing = !playing; $('bPlay').textContent = playing ? 'Pause' : 'Play'; });
$('bRestart').addEventListener('click', () => { restart(); playing = true; $('bPlay').textContent = 'Pause'; });
$('bNext').addEventListener('click', nextEvent);
$('bProc').addEventListener('click', () => { useProcedural(); restart(); });

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image load failed')); };
    im.src = url;
  });
}
$('fFiles').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []).slice(0, 4);
  if (!files.length) return;
  const cv = [];
  for (const f of files) { try { cv.push(fitToSquare(await loadImage(f))); } catch (err) { console.warn(err); } }
  e.target.value = '';
  if (!cv.length) return;
  setVariants(cv); proceduralMode = false;
  $('vinfo').textContent = 'Variants: ' + cv.length + ' uploaded image' + (cv.length > 1 ? 's' : '') + (cv.length < 4 ? ' (stack wraps after ' + cv.length + ')' : '') + '.';
  restart();
});

// Console hook for a real events.json (array of {t, pitch, vel}).
window.XANADU = {
  get EVENTS() { return EVENTS; },
  setEvents(list) { EVENTS = list.map(dropFromEvent).sort((a, b) => a.t - b.t); restart(); },
  RULE
};

/* ======================================================================
   Start
   ====================================================================== */
try {
  useProcedural();
  restart();
  // debug: #seek=NN fast-forwards NN seconds of sim time before the first frame
  const m = /[#?&]seek=([0-9.]+)/.exec(location.href);
  if (m) { const n = Math.round(parseFloat(m[1]) * 60); for (let i = 0; i < n; i++) substep(); }
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
} catch (err) { fail(String(err && err.message || err)); }
})();
</script>
</body>
